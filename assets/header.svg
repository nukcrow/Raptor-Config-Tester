
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#11151a"/>
      <stop offset="1" stop-color="#1b1f24"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#484F58" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8A8F98"/>
      <stop offset="1" stop-color="#484F58" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="230" fill="url(#bg)"/>

  <!-- Decorative lines -->
  <path d="M70 55 V175 M930 55 V175"
        stroke="#484F58" stroke-width="1" opacity="0.6"/>

  <path d="M100 178 H900"
        stroke="url(#line)" stroke-width="1"/>

  <!-- Side labels -->
  <g fill="#484F58" font-family="Courier New, monospace"
     font-size="9" letter-spacing="3">
    <text x="85" y="75">V2RAY</text>
    <text x="85" y="91">CONFIG</text>
    <text x="85" y="107">TESTER</text>

    <text x="915" y="75" text-anchor="end">WINDOWS</text>
    <text x="915" y="91" text-anchor="end">V1.0.0</text>
    <text x="915" y="107" text-anchor="end">RELEASED</text>
  </g>

  <!-- Main title -->
  <text x="500" y="105"
        text-anchor="middle"
        font-family="Fira Code, Courier New, monospace"
        font-size="54"
        font-weight="bold"
        letter-spacing="10"
        fill="#8A8F98">
    RAPTOR
    <animate attributeName="opacity"
             values="0.75;1;0.75"
             dur="4s"
             repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="500" y="137"
        text-anchor="middle"
        font-family="Fira Code, Courier New, monospace"
        font-size="13"
        letter-spacing="5"
        fill="#626A73">
    CONFIG TESTER
  </text>

  <!-- Tagline -->
  <text x="500" y="160"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="9"
        letter-spacing="3"
        fill="#484F58">
    COLLECT · TEST · FILTER · EXPORT
  </text>

  <!-- Animated waves -->
  <path fill="#1b1f24" opacity="0.55"
        d="M0 185 Q125 155 250 185 T500 185 T750 185 T1000 185 T1250 185 T1500 185 L1500 230 L0 230 Z">
    <animateTransform attributeName="transform"
                      type="translate"
                      from="0 0" to="-500 0"
                      dur="14s"
                      repeatCount="indefinite"/>
  </path>

  <path fill="#11151a" opacity="0.85"
        d="M0 198 Q125 173 250 198 T500 198 T750 198 T1000 198 T1250 198 T1500 198 L1500 230 L0 230 Z">
    <animateTransform attributeName="transform"
                      type="translate"
                      from="-500 0" to="0 0"
                      dur="10s"
                      repeatCount="indefinite"/>
  </path>

  <path fill="#080a0c"
        d="M0 213 Q125 198 250 213 T500 213 T750 213 T1000 213 T1250 213 T1500 213 L1500 230 L0 230 Z">
    <animateTransform attributeName="transform"
                      type="translate"
                      from="0 0" to="-500 0"
                      dur="7s"
                      repeatCount="indefinite"/>
  </path>

  <!-- Footer -->
  <text x="500" y="219"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="8"
        letter-spacing="4"
        fill="#484F58">
    RAPTOR CONFIG TESTER
  </text>
</svg>
